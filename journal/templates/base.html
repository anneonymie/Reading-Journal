<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reading Journal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ url_for('journal.library') }}">Reading Journal</a>
    <nav>
      <a href="{{ url_for('journal.library') }}">Library</a>
      <a class="button small" href="{{ url_for('journal.work_new') }}">Add work</a>
    </nav>
  </header>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash" role="status">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>
    {% endif %}
  {% endwith %}
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site">Reading Journal {{ app_version }}</footer>
</body>
</html>
